#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# :androidApp pulls :composeApp's Compose resources in as an asset source directory. Registering the
# producing task (instead of a bare path) is what gives every consumer — the asset merger and lint's
# own analysis tasks — a declared dependency; without it release builds fail Gradle's
# implicit-dependency validation. AGP rejects task providers in the SourceSet API unless this is set.
# The blessed long-term alternative is the Variant API (Sources.addGeneratedSourceDirectory).
android.sourceset.disallowProvider=false
